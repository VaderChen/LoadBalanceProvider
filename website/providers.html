<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Provider 管理</title>
  <script src="i18n.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #dde3ea;
      --line-strong: #cbd5df;
      --text: #1f2933;
      --muted: #5d6b7a;
      --muted-soft: #8a97a6;
      --primary: #2f7f58;
      --primary-dark: #236142;
      --accent: #cf653d;
      --danger: #b44931;
      --shadow: 0 14px 36px rgba(18, 31, 44, .08);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .provider-list::-webkit-scrollbar,
    .editor-body::-webkit-scrollbar {
      display: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      display: grid;
      gap: 2px;
    }

    h1,
    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .icon-button,
    .text-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: var(--radius);
      min-height: 38px;
      transition: border-color .16s ease, background .16s ease, color .16s ease;
    }

    .icon-button {
      width: 40px;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }

    .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-weight: 700;
    }

    .icon-button:hover,
    .text-button:hover {
      border-color: var(--line-strong);
      background: #f8fafc;
    }

    .text-button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      position: relative;
      min-width: 62px;
    }

    .text-button.primary:hover {
      background: #bd5731;
    }

    .text-button.primary.saving {
      color: transparent;
      pointer-events: none;
    }

    .text-button.primary.saving::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .48);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .72s linear infinite;
    }

    .text-button.primary.saved {
      background: var(--primary);
      border-color: var(--primary);
    }

    .text-button.oauth {
      width: 100%;
      min-height: 48px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-size: 16px;
    }

    .oauth-hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .oauth-manual-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .oauth-manual-toggle input {
      width: 16px;
      height: 16px;
      min-height: 0;
      padding: 0;
    }

    .oauth-manual-panel {
      display: grid;
      gap: 8px;
    }

    .oauth-manual-panel[hidden] {
      display: none;
    }

    .oauth-manual-panel textarea {
      min-height: 92px;
      resize: vertical;
    }

    .oauth-manual-message {
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .oauth-manual-message.error {
      color: var(--danger);
      font-weight: 700;
    }

    .oauth-manual-message.success {
      color: var(--primary);
      font-weight: 700;
    }

    .text-button.oauth-complete {
      width: 100%;
      min-height: 42px;
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .text-button.oauth-complete:hover {
      background: var(--primary-dark);
    }

    .provider-list {
      display: grid;
      gap: 12px;
      padding: 16px;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .provider-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 16px;
      text-align: left;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
      cursor: grab;
    }

    .provider-card:active {
      cursor: grabbing;
    }

    .provider-card.dragging {
      opacity: .58;
      box-shadow: none;
    }

    .provider-card.drop-before {
      border-top-color: var(--primary);
      box-shadow: inset 0 3px 0 var(--primary);
    }

    .provider-card.drop-after {
      border-bottom-color: var(--primary);
      box-shadow: inset 0 -3px 0 var(--primary);
    }

    .provider-card.active {
      border-color: #7fb194;
      box-shadow: 0 0 0 3px rgba(47, 127, 88, .12);
      background: #fbfffd;
    }

    .provider-card-main {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .provider-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .provider-name {
      font-weight: 800;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      min-width: 64px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      background: #e8f2ed;
      border: 1px solid transparent;
    }

    .badge.off {
      color: var(--muted);
      background: #fff;
      border-color: #d5e2dc;
    }

    .provider-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      position: relative;
      width: 52px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      background: #cfd5df;
      padding: 0;
      transition: background .16s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      top: 4px;
      left: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(15, 23, 42, .22);
      transition: transform .16s ease;
    }

    .switch.on {
      background: #31bf62;
    }

    .switch.on::after {
      transform: translateX(20px);
    }

    .editor {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .editor-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 22px;
      padding: 18px;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      align-items: stretch;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-content: start;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    input,
    select {
      height: 40px;
      padding: 0 12px;
    }

    textarea {
      min-height: 0;
      resize: vertical;
      padding: 12px;
      line-height: 1.55;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #7fb194;
      box-shadow: 0 0 0 3px rgba(47, 127, 88, .12);
    }

    .with-check {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px;
      gap: 10px;
    }

    .check-button {
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      position: relative;
      min-width: 72px;
    }

    .check-button:hover {
      background: var(--primary-dark);
    }

    .check-button.testing {
      color: transparent;
      pointer-events: none;
    }

    .check-button.testing::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      top: 50%;
      left: 50%;
      margin-top: -9px;
      margin-left: -9px;
      border: 2px solid rgba(255, 255, 255, .48);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .72s linear infinite;
    }

    .check-button.failed {
      background: var(--danger);
    }

    .side-block {
      display: grid;
      gap: 14px;
      align-content: stretch;
      height: 100%;
      min-height: 0;
    }

    .responsibility-box {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 10px;
      background: #fbfcfd;
      height: 100%;
      min-height: 420px;
    }

    .responsibility-box .subtle {
      font-size: 13px;
    }

    .capability-section {
      display: grid;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .capability-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .capability-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .capability-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .capability-item input {
      width: 16px;
      height: 16px;
      padding: 0;
      flex: 0 0 auto;
    }

    .editor-footer {
      border-top: 1px solid var(--line);
      padding: 14px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
    }

    .reset-credit-panel {
      grid-column: 1 / -1;
      min-width: 0;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .reset-credit-panel[hidden] {
      display: none;
    }

    .provider-settings {
      grid-column: 1 / -1;
      min-width: 0;
    }

    .provider-settings[hidden] {
      display: none;
    }

    .billing-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 14px 12px;
    }

    .billing-spinner {
      order: -1;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border: 2px solid var(--line);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: billing-spin .8s linear infinite;
    }

    @keyframes billing-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .billing-spinner { animation: none; }
    }

    .billing-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .8fr) 48px;
      gap: 6px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 10px;
      font-size: 12px;
    }

    .billing-row > * {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .billing-heading {
      font-weight: 700;
      color: var(--muted);
    }

    .billing-row .text-button {
      width: 48px;
      min-height: 32px;
      padding: 4px;
      font-size: 12px;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
    }

    .billing-message {
      margin: 0;
      padding: 0 14px 12px;
      font-size: 13px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .billing-message:empty { display: none; }
    .billing-message.error { color: var(--danger); }

    .billing-more {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    .provider-settings-fields {
      min-width: 0;
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .provider-settings-summary span {
      flex: 1;
      min-width: 0;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .provider-settings,
    .reset-credit-details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .provider-settings-summary,
    .reset-credit-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      padding: 12px 14px;
      cursor: pointer;
      list-style: none;
    }

    .provider-settings-summary::-webkit-details-marker,
    .reset-credit-summary::-webkit-details-marker {
      display: none;
    }

    .provider-settings-summary::after,
    .reset-credit-summary::after {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-right: 1px solid var(--muted);
      border-bottom: 1px solid var(--muted);
      transform: rotate(45deg);
    }

    .provider-settings[open] > summary::after,
    .reset-credit-details[open] > summary::after {
      transform: rotate(225deg);
    }

    .reset-credit-label {
      font-weight: 800;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .reset-credit-count {
      margin-left: auto;
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 8px;
      color: #166534;
      background: #dcfce7;
    }

    .reset-credit-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    .reset-credit-row strong {
      display: block;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .reset-credit-expiry {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .reset-credit-empty {
      margin: 0;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .reset-credit-status {
      grid-column: 1 / -1;
      min-height: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-top: 8px;
    }

    .reset-credit-status:empty {
      display: none;
    }

    .reset-credit-status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .text-button.reset-credit-use {
      min-height: 32px;
      padding: 5px 10px;
      font-size: 13px;
      color: #fff;
      background: #202326;
      border-color: #202326;
      white-space: nowrap;
    }

    .text-button.reset-credit-use:hover:not(:disabled) {
      color: #fff;
      border-color: #404448;
      background: #404448;
    }

    .text-button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .reset-confirm-dialog {
      width: min(430px, calc(100vw - 32px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: #fff;
      box-shadow: 0 24px 60px rgba(18, 31, 44, .22);
    }

    .reset-confirm-dialog::backdrop {
      background: rgba(31, 41, 51, .38);
      backdrop-filter: blur(2px);
    }

    .reset-dialog-header,
    .reset-dialog-actions {
      display: flex;
      align-items: center;
      padding: 16px 18px;
    }

    .reset-dialog-header {
      border-bottom: 1px solid var(--line);
    }

    .reset-dialog-header h2 {
      font-size: 17px;
    }

    .reset-dialog-body {
      display: grid;
      gap: 10px;
      padding: 18px;
    }

    .reset-dialog-body p {
      margin: 0;
      line-height: 1.6;
    }

    .reset-dialog-expiry {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .reset-dialog-expiry span {
      color: var(--muted);
    }

    .reset-dialog-expiry strong {
      text-align: right;
    }

    .reset-dialog-message {
      min-height: 18px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }

    .reset-dialog-actions {
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--line);
    }

    .delete {
      color: var(--danger);
    }

    .empty {
      margin: 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(247, 248, 250, .88);
      backdrop-filter: blur(4px);
      transition: opacity .24s ease, visibility .24s ease;
    }

    .loading-overlay.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(320px, calc(100vw - 40px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .loading-title {
      font-weight: 800;
    }

    .progress-bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e6ebf0;
    }

    .progress-bar::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: progress 1.1s ease-in-out infinite;
    }

    svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes progress {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(250%);
      }
    }

    @media (max-width: 980px) {
      .shell,
      .editor-body {
        grid-template-columns: 1fr;
      }

      .responsibility-box {
        min-height: 360px;
      }

      .sidebar {
        min-height: 42vh;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 10px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .provider-card {
        grid-template-columns: 1fr;
      }

      .provider-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-title">載入 Provider 設定</div>
      <div class="subtle">正在初始化來源列表與模型資料</div>
      <div class="progress-bar" aria-hidden="true"></div>
    </div>
  </div>

  <main class="shell">
    <section class="panel sidebar" aria-label="Provider 列表">
      <header class="panel-header">
        <div class="title">
          <h1>來源列表</h1>
        </div>
        <button class="icon-button" id="addProvider" title="新增 Provider" aria-label="新增 Provider">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </header>
      <div class="provider-list" id="providerList"></div>
    </section>

    <section class="panel editor" aria-label="Provider 內容">
      <header class="panel-header">
        <div class="title">
          <h2>編輯來源</h2>
        </div>
      </header>

      <div class="editor-body" id="editorBody">
        <form class="form-grid" id="providerForm">
          <div class="field">
            <label for="providerName">名稱</label>
            <input id="providerName" name="name" autocomplete="off">
          </div>

          <div class="field">
            <label for="providerKind">類型</label>
            <select id="providerKind" name="kind">
              <optgroup label="線上">

    function createProvider(kind, enabled) {
      const template = providerTemplates[kind];

      return {
        id: "",
        name: template.label,
        kind,
        apiKey: "",
        apiKeyMasked: "",
        hasApiKey: false,
        oauth: false,
        oauthAccount: "",

        model: template.model,
        purpose: template.purpose,
        scale: template.scale,
        reasoningEffort: normalizeReasoningEffort(kind, template.reasoningEffort),
        responsibility: template.responsibility,
        capabilities: normalizeCapabilities(template.capabilities || ["chat", "reasoning"]),
        enabled,
        maxConcurrent: 4,
        priority: providers.length + 1
      };
    }

    function normalizeProvider(provider) {
      const kind = provider.kind && providerTemplates[provider.kind] ? provider.kind : inferProviderKind(provider);
      const template = providerTemplates[kind] || providerTemplates.custom;
      const host = normalizeProviderHost(kind, provider.host || template.host);
      const chatApi = normalizeProviderChatAPI(kind, provider.chatApi || template.chatApi);

      return {
        id: provider.id || "",
        name: provider.name || template.label,
        kind,
        apiKey: provider.apiKey || "",
        apiKeyMasked: provider.apiKeyMasked || "",
        hasApiKey: Boolean(provider.hasApiKey || provider.apiKeyMasked || provider.apiKey),
        oauth: Boolean(provider.oauth),
        oauthAccount: provider.oauthAccount || "",
        host,
        chatApi,
        model: provider.model || template.model,
        purpose: provider.purpose || template.purpose,
        scale: provider.scale || template.scale,
        reasoningEffort: normalizeReasoningEffort(kind, provider.reasoningEffort || template.reasoningEffort),
        responsibility: provider.responsibility || template.responsibility,
        capabilities: normalizeCapabilities(provider.capabilities || template.capabilities || ["chat", "reasoning"]),
        enabled: Boolean(provider.enabled),
        maxConcurrent: Number(provider.maxConcurrent) || 4,
        priority: Number(provider.priority) || 1
      };
    }

    function normalizeProviderHost(kind, host) {
      const value = String(host || "").trim().replace(/\/+$/, "");
      if (kind === "openai-codex" && !value) {
        return "https://chatgpt.com";
      }
      return value;
    }

    function normalizeProviderChatAPI(kind, chatApi) {
      const value = String(chatApi || "").trim();
      if (kind === "openai-codex" && (!value || value === "/v1/chat/completions")) {
        return "/backend-api/codex/responses";
      }
      return value;
    }

    function normalizeReasoningEffort(kind, effort) {
      const value = String(effort || "").trim().toLowerCase();
      if (kind !== "openai-codex") {
        return value;
      }
      return ["none", "minimal", "low", "medium", "high", "xhigh"].includes(value) ? value : "high";
    }

    function applyProviderTypeDefaults(provider, options = {}) {
      if (!provider) {
        return provider;
      }

      const template = providerTemplates[provider.kind] || providerTemplates.custom;
      provider.host = normalizeProviderHost(provider.kind, provider.host || template.host);
      provider.chatApi = normalizeProviderChatAPI(provider.kind, provider.chatApi || template.chatApi);
      provider.purpose = provider.purpose || template.purpose;
      provider.scale = provider.scale || template.scale;
      provider.reasoningEffort = normalizeReasoningEffort(provider.kind, provider.reasoningEffort || template.reasoningEffort);
      provider.responsibility = provider.responsibility || template.responsibility;
      if (!provider.capabilities || provider.capabilities.length === 0 || options.resetCapabilities) {
        provider.capabilities = normalizeCapabilities(template.capabilities || ["chat", "reasoning"]);
      }

      const models = fallbackModels(provider.kind);
      if (models.length > 0 && (!provider.model || (options.resetModel && !models.includes(provider.model)))) {
        provider.model = template.model || models[0];
      }
      return provider;
    }

    function inferProviderKind(provider) {
      const text = `${provider.name || ""} ${provider.host || ""} ${provider.id || ""}`.toLowerCase();
      if (text.includes("codex")) {
        return "openai-codex";
      }
      if (text.includes("openai")) {
        return "openai";
      }
      if (text.includes("minimax")) {
        return "minimax";
      }
      if (text.includes("ollama")) {
        return "ollama";
      }
      if (text.includes("omlx") || text.includes("mlx")) {
        return "omlx";
      }
      if (text.includes("vllm")) {
        return "vllm";
      }
      if (text.includes("llama.cpp") || text.includes("llamacpp")) {
        return "llamacpp";
      }
      return "custom";
    }

    function normalizeCapabilities(capabilities) {
      const aliases = {
        image: "vision",
        function_call: "function_calling",
        audio: "audio_analysis",
        speech: "tts",
        text_to_speech: "tts",
        transcribe: "transcription",
        video: "video_analysis"
      };
      const values = Array.isArray(capabilities) ? capabilities : [];
      return [...new Set(values.map(value => {
        const normalized = String(value || "").trim().toLowerCase();
        return aliases[normalized] || normalized;
      }).filter(Boolean))].sort();
    }

    function currentProvider() {

    function renderList() {
      providerList.innerHTML = "";

      if (providers.length === 0) {
        providerList.innerHTML = `<div class="empty">尚未建立來源</div>`;
        return;
      }

      providers.forEach(provider => {
        const card = document.createElement("article");
        card.className = `provider-card${provider.id === selectedId ? " active" : ""}`;
        card.tabIndex = 0;
        card.dataset.id = provider.id;
        card.draggable = true;

        card.innerHTML = `
          <div class="provider-card-main">
            <div class="provider-name-row">
              <div class="provider-name">${escapeHtml(provider.name || providerTemplates[provider.kind].label)}</div>
              <span class="badge ${provider.enabled ? "" : "off"}">${provider.enabled ? "啟用中" : "可用"}</span>
            </div>
          </div>
          <div class="provider-actions">
            <button class="switch ${provider.enabled ? "on" : ""}" type="button" title="切換啟用狀態" aria-label="切換啟用狀態"></button>

            </button>
          </div>
        `;

        card.addEventListener("click", async event => {
          if (event.target.closest(".delete")) {
            try {
              await deleteProvider(provider.id);
            } catch (_err) {
              return;
            }
            return;
          }

          if (event.target.closest(".switch")) {
            const previousEnabled = provider.enabled;
            provider.enabled = !provider.enabled;
            selectedId = provider.id;
            try {
              await persistProvider(provider);
              render();
            } catch (_err) {
              provider.enabled = previousEnabled;
              render();
            }
            return;
          }

          selectedId = provider.id;
          render();
        });

        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            selectedId = provider.id;
            render();
          }
        });
        card.addEventListener("dragstart", event => {
          if (event.target.closest("button")) {
            event.preventDefault();
            return;
          }
          draggedProviderId = provider.id;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", provider.id);
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", () => {
          draggedProviderId = "";
          card.classList.remove("dragging");
          clearDropMarkers();
        });
        card.addEventListener("dragover", event => {
          event.preventDefault();
          const draggedID = draggedProviderId;
          if (!draggedID || draggedID === provider.id) {
            return;
          }
          event.dataTransfer.dropEffect = "move";
          clearDropMarkers();
          card.classList.add(dropAfter(event, card) ? "drop-after" : "drop-before");
        });
        card.addEventListener("dragleave", () => {
          card.classList.remove("drop-before", "drop-after");
        });
        card.addEventListener("drop", event => {
          event.preventDefault();
          const draggedID = draggedProviderId || event.dataTransfer.getData("text/plain");
          reorderProvider(draggedID, provider.id, dropAfter(event, card));
        });

        providerList.appendChild(card);
      });
    }

    function clearDropMarkers() {
      providerList.querySelectorAll(".drop-before, .drop-after").forEach(card => {
        card.classList.remove("drop-before", "drop-after");
      });
    }

    function dropAfter(event, card) {
      const rect = card.getBoundingClientRect();
      return event.clientY > rect.top + rect.height / 2;
    }

    async function reorderProvider(draggedID, targetID, insertAfter) {
      clearDropMarkers();
      if (!draggedID || !targetID || draggedID === targetID) {
        return;
      }

      const draggedIndex = providers.findIndex(provider => provider.id === draggedID);
      const targetIndex = providers.findIndex(provider => provider.id === targetID);
      if (draggedIndex < 0 || targetIndex < 0) {
        return;
      }

      const [dragged] = providers.splice(draggedIndex, 1);
      let insertIndex = providers.findIndex(provider => provider.id === targetID);
      if (insertAfter) {
        insertIndex += 1;
      }
      providers.splice(insertIndex, 0, dragged);
      providers.forEach((provider, index) => {
        provider.priority = index + 1;
      });
      selectedId = dragged.id;
      render();

      try {
        const payload = await apiRequest("api/provider-configs/reorder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: providers.map(provider => provider.id).filter(Boolean) })
        });
        providers = (payload.providers || providers).map(normalizeProvider);
        selectedId = providers.some(provider => provider.id === dragged.id) ? dragged.id : providers[0]?.id || null;
        render();
      } catch (_err) {
        await loadProviderConfigs();
        render();
      }
    }

    function renderEditor() {
      const provider = currentProvider();
      if (!provider) {
        providerForm.hidden = true;
        editorBody.querySelector(".side-block").hidden = true;
        resetCreditLoadSeq += 1;
        resetCreditPanel.hidden = true;
        syncBillingPanel(null);
        return;
      }

      providerForm.hidden = false;
      editorBody.querySelector(".side-block").hidden = false;

      fields.name.value = provider.name;
      fields.kind.value = provider.kind;
      fields.apiKey.value = provider.apiKey || provider.apiKeyMasked || (provider.hasApiKey ? API_KEY_MASK : "");
      fields.host.value = provider.host;
      fields.chatApi.value = provider.chatApi;
      fields.maxConcurrent.value = provider.maxConcurrent;
      fields.reasoningEffort.value = normalizeReasoningEffort(provider.kind, provider.reasoningEffort);
      reasoningEffortField.hidden = false;
      fields.responsibility.value = provider.responsibility || "";

      updateEditorHeader(provider);
      syncOAuthButton(provider);
      syncResetCreditPanel(provider);
      syncBillingPanel(provider);
      renderCapabilities(provider);
      loadModelOptions(provider);
    }

    function updateEditorHeader(provider) {
    }

    function providerOAuthSupported(provider) {
      return provider && provider.kind === "openai-codex";
    }

    function syncOAuthButton(provider, mode = "") {
      if (!oauthButton) {
        return;
      }
      const supported = providerOAuthSupported(provider);
      oauthButton.disabled = !supported || mode === "pending";
      oauthButton.dataset.oauthState = mode || (provider?.oauth ? "connected" : "idle");
      if (oauthHint) {
        oauthHint.textContent = supported
          ? "若 callback 未自動完成，可貼回 redirect URL 或 code。"
          : "此來源未支援 OAuth，請使用 API Key。";
      }
      if (oauthManualToggle) {
        oauthManualToggle.hidden = !supported;
      }
      if (!supported) {
        setOAuthManualMode(false);
      }

      if (!supported) {
        oauthButton.textContent = "OAuth 不適用";
        return;
      }
      if (mode === "pending") {
        oauthButton.textContent = "OAuth 連線中...";
        return;
      }
      if (provider.oauth) {
        oauthButton.textContent = provider.oauthAccount ? `OAuth 已連線 (${provider.oauthAccount})` : "OAuth 已連線";
        return;
      }
      oauthButton.textContent = "OAuth 登入";
    }

    function syncBillingPanel(provider) {
      const supported = providerOAuthSupported(provider);
      const key = JSON.stringify([provider?.id, provider?.kind, provider?.oauth, provider?.oauthAccount]);
      billingPanel.hidden = !supported;
      if (key === billingProviderKey) {
        return;
      }
      billingProviderKey = key;
      billingLoadSeq += 1;
      billingAbort?.abort();
      billingAbort = null;
      billingLoading = false;
      billingTransactions = [];
      billingNextCursor = "";
      billingList.replaceChildren();
      billingList.setAttribute("aria-busy", "false");
      billingMessage.textContent = "";
      billingMessage.classList.remove("error");
      billingSpinner.hidden = true;
      billingMoreRow.hidden = true;
      billingQuery.disabled = !supported || !provider?.id;
    }

    function billingInvoiceURL(raw) {
      try {
        const url = new URL(raw);
        return url.protocol === "https:" && url.host === "invoice.stripe.com"
          && !url.username && !url.password && url.pathname.startsWith("/i/") ? url.href : "";
      } catch (_) {
        return "";
      }
    }

    function renderBillingTransactions() {
      billingList.replaceChildren();
      const statuses = { paid: "已付款", open: "待付款", draft: "草稿", void: "已作廢", uncollectible: "無法收款" };
      if (billingTransactions.length) {
        const heading = document.createElement("div");
        heading.className = "billing-row billing-heading";
        heading.setAttribute("role", "row");
        for (const label of ["日期", "金額", "狀態", "下載"]) {
          const cell = document.createElement("span");
          cell.setAttribute("role", "columnheader");
          cell.textContent = label;
          heading.append(cell);
        }
        billingList.append(heading);
      }
      for (const transaction of billingTransactions) {
        const row = document.createElement("div");
        row.className = "billing-row";
        row.setAttribute("role", "row");
        const date = new Date(transaction.created_at);
        let amount = "金額未提供";
        if (Number.isSafeInteger(transaction.amount) && /^[a-z]{3}$/i.test(transaction.currency || "")) {
          try {
            const formatter = new Intl.NumberFormat("zh-TW", { style: "currency", currency: transaction.currency.toUpperCase() });
            amount = formatter.format(transaction.amount / 10 ** formatter.resolvedOptions().maximumFractionDigits);
          } catch (_) {}
        }
        for (const value of [Number.isNaN(date.getTime()) ? "日期未提供" : date.toLocaleDateString("zh-TW"), amount, statuses[transaction.status] || transaction.status || "未知狀態"]) {
          const span = document.createElement("span");
          span.setAttribute("role", "cell");
          span.textContent = value;
          row.append(span);
        }
        const href = billingInvoiceURL(transaction.invoice_url);
        const download = document.createElement(href ? "a" : "button");
        download.className = "text-button";
        download.textContent = "下載";
        if (href) {
          download.href = href;
          download.target = "_blank";
          download.rel = "noopener noreferrer";
          download.referrerPolicy = "no-referrer";
          download.title = "開啟帳單頁下載帳單或收據";
        } else {
          download.type = "button";
          download.disabled = true;
          download.title = "此交易未提供可用的帳單連結";
        }
        const action = document.createElement("span");
        action.setAttribute("role", "cell");
        action.append(download);
        row.append(action);
        billingList.append(row);
      }
      billingMoreRow.hidden = !billingNextCursor;
    }

    async function loadBillingTransactions(more = false) {
      const provider = currentProvider();
      if (!providerOAuthSupported(provider) || !provider.id || billingLoading || (more && !billingNextCursor)) {
        return;
      }
      if (!provider.oauth) {
        billingMessage.textContent = "請先連線 OAuth，再查詢帳單。";
        billingMessage.classList.add("error");
        return;
      }
      const ticket = ++billingLoadSeq;
      const cursor = more ? billingNextCursor : "";
      billingAbort = new AbortController();
      billingLoading = true;
      billingQuery.disabled = true;
      billingMore.disabled = true;
      billingSpinner.hidden = false;
      billingList.setAttribute("aria-busy", "true");
      billingMessage.textContent = "查詢中...";
      billingMessage.classList.remove("error");
      if (!more) {
        billingTransactions = [];
        billingNextCursor = "";
        billingList.replaceChildren();
        billingMoreRow.hidden = true;
      }
      try {
        const query = cursor ? `?cursor=${encodeURIComponent(cursor)}` : "";
        const payload = await apiRequest(`api/provider-configs/${encodeURIComponent(provider.id)}/billing${query}`, { signal: billingAbort.signal });
        if (ticket !== billingLoadSeq || provider.id !== selectedId) return;
        if (!Array.isArray(payload.transactions)) throw new Error("帳單回應格式不正確");
        const unique = new Map(billingTransactions.map(item => [item.id, item]));
        for (const transaction of payload.transactions) {
          if (transaction && typeof transaction.id === "string" && transaction.id) unique.set(transaction.id, transaction);
        }
        billingTransactions = [...unique.values()].sort((a, b) => (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0));
        billingNextCursor = typeof payload.next_cursor === "string" && payload.next_cursor !== cursor ? payload.next_cursor : "";
        renderBillingTransactions();
        billingMessage.textContent = billingTransactions.length ? "" : "目前沒有交易紀錄。";
      } catch (err) {
        if (ticket !== billingLoadSeq || provider.id !== selectedId || err.name === "AbortError") return;
        billingMessage.textContent = err.message || "帳單查詢失敗，請重試。";
        billingMessage.classList.add("error");
      } finally {
        if (ticket === billingLoadSeq) {
          billingLoading = false;
          billingAbort = null;
          billingQuery.disabled = false;
          billingMore.disabled = false;
          billingSpinner.hidden = true;
          billingList.setAttribute("aria-busy", "false");
        }
      }
    }

    function syncResetCreditPanel(provider) {
      const supported = providerOAuthSupported(provider) && provider.oauth && provider.id;
      resetCreditLoadSeq += 1;
      resetCreditPanel.hidden = !supported;
      resetCreditCount = null;
      resetCredits = [];
      resetCreditStatus.textContent = "";
      resetCreditStatus.classList.remove("error");
      resetCreditList.replaceChildren();
      if (!supported) {
        return;
      }
      resetCreditCountLabel.textContent = "載入中...";
      loadResetCreditCount(provider, resetCreditLoadSeq);
    }

    async function loadResetCreditCount(provider, ticket = ++resetCreditLoadSeq) {
      try {
        const payload = await apiRequest(`api/provider-configs/${encodeURIComponent(provider.id)}/rate-limit-reset`);
        if (ticket !== resetCreditLoadSeq || provider.id !== selectedId) {
          return;
        }
        resetCreditCount = Math.max(0, Number(payload.availableCount) || 0);
        resetCredits = Array.isArray(payload.credits)
          ? payload.credits.filter(credit => credit && typeof credit.id === "string" && credit.id.trim())
          : [];
        resetCreditCountLabel.textContent = `可用 ${resetCreditCount} 次`;
        renderResetCredits();
        resetCreditStatus.textContent = "";
        resetCreditStatus.classList.remove("error");
      } catch (err) {
        if (ticket !== resetCreditLoadSeq || provider.id !== selectedId) {
          return;
        }
        resetCreditCount = null;
        resetCredits = [];
        resetCreditCountLabel.textContent = "無法取得";
        resetCreditList.replaceChildren();
        resetCreditStatus.textContent = err.message || "無法取得重置次數";
        resetCreditStatus.classList.add("error");
      }
    }

    function createResetIdempotencyKey() {
      if (window.crypto?.randomUUID) {
        return window.crypto.randomUUID();
      }
      const randomPart = Math.random().toString(36).slice(2);
      return `reset-${Date.now()}-${randomPart}`;
    }

    function renderResetCredits() {
      resetCreditList.replaceChildren();
      if (resetCreditCount < 1 || resetCredits.length === 0) {
        const empty = document.createElement("p");
        empty.className = "reset-credit-empty";
        empty.textContent = resetCreditCount < 1 ? "目前沒有可用的重置券。" : "上游未提供重置券明細，暫時無法選取。";
        resetCreditList.append(empty);
        return;
      }
      for (const credit of resetCredits) {
        const row = document.createElement("div");
        row.className = "reset-credit-row";
        const copy = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = "完整重置";
        const expiry = document.createElement("div");
        expiry.className = "reset-credit-expiry";
        expiry.textContent = `到期時間：${formatResetCreditExpiry(credit.expiresAt)}`;
        expiry.title = credit.expiresAt || "";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "text-button reset-credit-use";
        button.textContent = "使用重置";
        button.disabled = resetInFlight || Date.parse(credit.expiresAt) <= Date.now();
        button.setAttribute("aria-label", `使用重置，到期時間：${formatResetCreditExpiry(credit.expiresAt)}`);
        button.addEventListener("click", () => openResetConfirmation(credit));
        copy.append(title, expiry);
        row.append(copy, button);
        resetCreditList.append(row);
      }
    }

    function formatResetCreditExpiry(value) {
      if (!value) {
        return "未提供到期時間";
      }
      const expiresAt = new Date(value);
      if (Number.isNaN(expiresAt.getTime())) {
        return String(value);
      }
      return new Intl.DateTimeFormat("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        timeZoneName: "short"
      }).format(expiresAt);
    }

    function openResetConfirmation(credit) {
      const provider = currentProvider();
      if (!provider || resetInFlight || resetCreditCount === null || resetCreditCount < 1
          || !resetCredits.includes(credit) || Date.parse(credit.expiresAt) <= Date.now()) {
        return;
      }
      pendingResetProviderId = provider.id;
      pendingResetCreditId = credit.id;
      const attemptKey = JSON.stringify([provider.id, credit.id]);
      if (!resetCreditAttempts.has(attemptKey)) {
        resetCreditAttempts.set(attemptKey, createResetIdempotencyKey());
      }
      pendingResetIdempotencyKey = resetCreditAttempts.get(attemptKey);
      resetConfirmText.textContent = `確定要為「${provider.name}」使用這張完整重置券嗎？目前可用 ${resetCreditCount} 次。`;
      resetConfirmExpiresAt.textContent = formatResetCreditExpiry(credit.expiresAt);
      resetConfirmExpiresAt.title = credit.expiresAt || "";
      resetConfirmMessage.textContent = "";
      resetConfirmSubmit.disabled = false;
      resetConfirmSubmit.textContent = "確認重置";
      resetConfirmDialog.showModal();
    }

    function clearResetConfirmation() {
      pendingResetProviderId = "";
      pendingResetCreditId = "";
      pendingResetIdempotencyKey = "";
      resetConfirmMessage.textContent = "";
      resetConfirmSubmit.disabled = false;
      resetConfirmSubmit.textContent = "確認重置";
    }

    async function consumeResetCredit() {
      if (resetInFlight || !pendingResetProviderId || !pendingResetCreditId || !pendingResetIdempotencyKey) {
        return;
      }
      const providerId = pendingResetProviderId;
      const creditId = pendingResetCreditId;
      resetInFlight = true;
      resetConfirmCancel.disabled = true;
      resetConfirmSubmit.disabled = true;
      resetConfirmSubmit.textContent = "重置中...";
      resetConfirmMessage.textContent = "";
      try {
        const payload = await apiRequest(`api/provider-configs/${encodeURIComponent(providerId)}/rate-limit-reset`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idempotencyKey: pendingResetIdempotencyKey, creditId })
        });
        const outcome = String(payload.outcome || "");
        if (!["reset", "already_redeemed", "no_credit", "nothing_to_reset"].includes(outcome)) {
          throw new Error("上游回傳未知的重置結果");
        }
        resetCreditAttempts.delete(JSON.stringify([providerId, creditId]));
        resetConfirmDialog.close();
        clearResetConfirmation();

        const provider = providers.find(item => item.id === providerId);
        if (provider && provider.id === selectedId) {
          await loadResetCreditCount(provider);
          if (providerId !== selectedId) {
            return;
          }
          if (outcome === "reset") {
            resetCreditStatus.textContent = payload.windowsReset > 0
              ? `重置完成，已重置 ${payload.windowsReset} 個用量視窗。`
              : "重置完成。";
          } else if (outcome === "already_redeemed") {
            resetCreditStatus.textContent = "此重置請求先前已完成。";
          } else if (outcome === "no_credit") {
            resetCreditStatus.textContent = "所選重置券已不可用，請重新選擇。";
          } else {
            resetCreditStatus.textContent = "目前用量尚未達可重置條件。";
          }
          resetCreditStatus.classList.toggle("error", outcome === "no_credit" || outcome === "nothing_to_reset");
        }
      } catch (err) {
        resetConfirmMessage.textContent = `${err.message || "重置失敗"}。可重試本次操作，系統不會重複扣除。`;
        resetConfirmSubmit.disabled = false;
        resetConfirmSubmit.textContent = "重試";
      } finally {
        resetInFlight = false;
        resetConfirmCancel.disabled = false;
        if (resetCreditCount !== null) {
          renderResetCredits();
        }
      }
    }

    function setOAuthManualMode(enabled, message = "", type = "") {
      if (oauthManualMode) {
        oauthManualMode.checked = Boolean(enabled);
      }
      if (oauthManualPanel) {
        oauthManualPanel.hidden = !enabled;
      }
      setOAuthManualMessage(message, type);
      if (enabled && oauthManualInput) {
        window.setTimeout(() => oauthManualInput.focus(), 0);
      }
    }

    function setOAuthManualMessage(message = "", type = "") {
      if (!oauthManualMessage) {
        return;
      }
      oauthManualMessage.textContent = message;
      oauthManualMessage.classList.toggle("error", type === "error");
      oauthManualMessage.classList.toggle("success", type === "success");
    }

    function validateOAuthManualInput(input) {
      const text = String(input || "").trim();
      if (!text) {
        return "請貼上 redirect URL 或 authorization code。";
      }
      try {
        const parsed = new URL(text);
        const code = (parsed.searchParams.get("code") || "").trim();
        if (code) {
          return "";
        }
        const host = parsed.hostname.toLowerCase();
        if (host.includes("auth.openai.com")) {
          return "這是 OAuth 登入起始連結，不是登入完成後的 callback URL。請先完成瀏覽器登入，再貼回網址列中的 redirect URL，或只貼 code 參數。";
        }
        return "貼上的 URL 沒有 code 參數。請貼登入完成後的 redirect URL，或直接貼 authorization code。";
      } catch (_err) {
        return "";
      }
    }

    function renderCapabilities(provider) {
      capabilityGrid.innerHTML = "";
      const selected = new Set(normalizeCapabilities(provider?.capabilities || []));
      capabilityDefinitions.forEach(definition => {
        const item = document.createElement("label");
        item.className = "capability-item";
        if (definition.title) {
          item.title = definition.title;
        }
        item.innerHTML = `
          <input type="checkbox" value="${escapeHtml(definition.value)}" ${selected.has(definition.value) ? "checked" : ""}>
          <span>${escapeHtml(definition.label)}</span>
        `;
        capabilityGrid.appendChild(item);
      });
    }

    function selectedCapabilities() {
      return normalizeCapabilities([...capabilityGrid.querySelectorAll("input[type='checkbox']:checked")].map(input => input.value));
    }

    function render() {
      snapshot = currentProvider() ? structuredClone(currentProvider()) : null;
      renderList();
      renderEditor();
    }

    function syncFromForm() {
      const provider = currentProvider();
      if (!provider) {
        return;
      }

      provider.name = fields.name.value.trim();
      provider.kind = fields.kind.value;
      provider.apiKey = apiKeyValueForSave(fields.apiKey.value);
      provider.hasApiKey = provider.hasApiKey || provider.apiKey !== "";
      provider.apiKeyMasked = provider.apiKey === "" && provider.hasApiKey ? (provider.apiKeyMasked || API_KEY_MASK) : "";
      provider.host = normalizeProviderHost(provider.kind, fields.host.value.trim());
      provider.chatApi = normalizeProviderChatAPI(provider.kind, fields.chatApi.value.trim());
      provider.model = fields.model.value;
      provider.maxConcurrent = Number(fields.maxConcurrent.value) || 1;
      provider.reasoningEffort = normalizeReasoningEffort(provider.kind, fields.reasoningEffort.value);
      provider.responsibility = fields.responsibility.value.trim();
      provider.capabilities = selectedCapabilities();
      updateEditorHeader(provider);
      renderList();
    }

    async function deleteProvider(id) {
      if (id) {
        await apiRequest(`api/provider-configs/${encodeURIComponent(id)}`, { method: "DELETE" });
      }

      providers = providers.filter(provider => provider.id !== id);
      if (selectedId === id) {
        selectedId = providers[0]?.id || null;
      }
      render();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function apiKeyValueForSave(value) {
      const trimmed = value.trim();
      if (trimmed === "" || trimmed.includes("•")) {
        return "";
      }
      return value;
    }

    async function loadProviderConfigs(options = {}) {
      const preferredSelectedId = options.selectedId || selectedId;
      try {
        const payload = await apiRequest("api/provider-configs");
        providers = (payload.providers || []).map(normalizeProvider);
      } catch (_err) {
        providers = [
          createProvider("openai", true),
          createProvider("minimax", false)
        ];
      }

      if (providers.length === 0) {
        providers = [
          createProvider("openai", true),
          createProvider("minimax", false)
        ];
      }

      selectedId = providers.some(provider => provider.id === preferredSelectedId)
        ? preferredSelectedId
        : providers[0]?.id || null;
    }

    async function persistProvider(provider, options = {}) {
      const normalized = normalizeProvider(provider);
      normalized.apiKey = apiKeyValueForSave(normalized.apiKey || normalized.apiKeyMasked || "");
      const isNew = !normalized.id;
      const url = isNew ? "api/provider-configs" : `api/provider-configs/${encodeURIComponent(normalized.id)}`;
      const method = isNew ? "POST" : "PUT";
      let saved;
      try {
        saved = normalizeProvider(await apiRequest(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(normalized)
        }));
      } catch (_err) {
        if (isNew || !String(_err.message || "").toLowerCase().includes("not found")) {
          throw _err;
        }

        normalized.id = "";
        saved = normalizeProvider(await apiRequest("api/provider-configs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(normalized)
        }));
      }

      const index = providers.findIndex(item => item.id === provider.id);
      if (index >= 0) {
        providers[index] = saved;
      } else {
        providers.push(saved);
      }
      if (!options.keepSelection) {
        selectedId = saved.id;
      }
      return saved;
    }

    function authHeaders(extraHeaders = {}) {
      return {
        Accept: "application/json",
        ...extraHeaders
      };
    }

    function redirectToLogin() {
      if (window.top && window.top !== window) {
        window.top.postMessage({ type: "lbp-session-expired" }, window.location.origin);
        return;
      }
      window.location.replace("login.html");
    }

    async function apiRequest(url, options = {}) {
      const headers = authHeaders(options.headers || {});
      const authRedirect = options.authRedirect !== false;
      const requestOptions = { ...options };
      delete requestOptions.authRedirect;
      const response = await fetch(url, {
        ...requestOptions,
        headers,
        credentials: "same-origin",
        cache: "no-store"
      });

      const text = await response.text();
      let payload = {};
      if (text) {
        try {
          payload = JSON.parse(text);
        } catch (_err) {
          payload = { message: text };
        }
      }
      if (!response.ok) {
        if (response.status === 401 && authRedirect) {
          redirectToLogin();
        }
        const error = new Error(payload?.error?.message || payload?.detail || payload?.message || `API request failed: ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function fallbackModels(kind) {
      const template = providerTemplates[kind] || providerTemplates.custom;
      return [...new Set([template.model].filter(Boolean))];
    }

    function setModelOptions(models, selectedModel, keepSelected) {
      const normalizedModels = [...new Set(models.filter(Boolean))];
      if (keepSelected && selectedModel && !normalizedModels.includes(selectedModel)) {
        normalizedModels.unshift(selectedModel);
      }

      fields.model.innerHTML = "";
      normalizedModels.forEach(model => {
        const option = document.createElement("option");
        option.value = model;
        option.textContent = model;
        fields.model.appendChild(option);
      });

      fields.model.disabled = normalizedModels.length === 0;
      fields.model.value = selectedModel && normalizedModels.includes(selectedModel) ? selectedModel : normalizedModels[0] || "";
    }

    function setModelLoading() {
      fields.model.innerHTML = "";
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "載入模型...";
      fields.model.appendChild(option);
      fields.model.disabled = true;
    }

    function setModelUnavailable(message) {
      fields.model.innerHTML = "";
      const option = document.createElement("option");
      option.value = "";
      option.textContent = message || "模型 API 無法取得";
      fields.model.appendChild(option);
      fields.model.disabled = true;
    }

    async function loadModelOptions(provider) {
      const ticket = ++modelLoadSeq;
      setModelLoading();

      if (!provider.id) {
        const models = fallbackModels(provider.kind);
        setModelOptions(models, provider.model, false);
        return;
      }

      const result = await fetchProviderModels(provider);
      if (ticket !== modelLoadSeq || provider.id !== selectedId) {
        return;
      }

      const models = result.models;
      if (result.error || models.length === 0) {
        setModelOptions(fallbackModels(provider.kind), provider.model, true);
        return;
      }

      setModelOptions(models, provider.model, false);

      if (!provider.model || !models.includes(provider.model)) {
        provider.model = fields.model.value;
      }
    }

    async function refreshProviderAfterSuccess(providerId) {
      await loadProviderConfigs({ selectedId: providerId });
      const provider = providers.find(item => item.id === providerId) || currentProvider();
      if (!provider) {
        render();
        return null;
      }

      selectedId = provider.id;
      applyProviderTypeDefaults(provider);
      const result = await fetchProviderModels(provider);
      const models = result.models;
      if (models.length > 0 && (!provider.model || !models.includes(provider.model))) {
        provider.model = models[0];
      }

      const saved = await persistProvider(provider, { keepSelection: true });
      selectedId = saved.id;
      render();
      return saved;
    }

    async function fetchProviderModels(provider) {
      if (!provider.id) {
        return { models: [], error: "" };
      }

      try {
        const payload = await apiRequest(`api/provider-configs/${encodeURIComponent(provider.id)}/models`, { authRedirect: false });
        return {
          models: Array.isArray(payload.models) ? payload.models : [],
          error: ""
        };
      } catch (err) {
        if (err.status === 401) {
          throw err;
        }
        return {
          models: [],
          error: "模型 API 無法取得"
        };
      }
    }

    function normalizeModelList(payload) {
      const source = Array.isArray(payload?.data) ? payload.data :
        Array.isArray(payload?.models) ? payload.models :
        Array.isArray(payload) ? payload : [];

      return [...new Set(source.map(item => {
        if (typeof item === "string") {
          return item;
        }
        return item?.id || item?.name || item?.model || "";
      }).filter(Boolean))].sort();
    }

    Object.values(fields).forEach(field => {
      field.addEventListener("input", syncFromForm);
      field.addEventListener("change", () => {
        const provider = currentProvider();
        if (!provider) {
          return;
        }

        if (field === fields.kind) {
          const template = providerTemplates[fields.kind.value];
          provider.name = template.label;
          provider.host = template.host;
          provider.chatApi = template.chatApi;
          provider.model = template.model;
          provider.purpose = template.purpose;
          provider.scale = template.scale;
          provider.reasoningEffort = normalizeReasoningEffort(fields.kind.value, template.reasoningEffort);
          provider.responsibility = template.responsibility;
          provider.capabilities = normalizeCapabilities(template.capabilities || ["chat", "reasoning"]);
          provider.kind = fields.kind.value;
          applyProviderTypeDefaults(provider, { resetCapabilities: true, resetModel: true });
          renderEditor();
        }

        syncFromForm();

        if (field === fields.kind || field === fields.host || field === fields.apiKey) {
          loadModelOptions(provider);
        }
      });
    });

    capabilityGrid.addEventListener("change", syncFromForm);

    billingQuery.addEventListener("click", () => loadBillingTransactions());
    billingMore.addEventListener("click", () => loadBillingTransactions(true));

    resetConfirmSubmit.addEventListener("click", consumeResetCredit);
    resetConfirmCancel.addEventListener("click", () => resetConfirmDialog.close());
    resetConfirmDialog.addEventListener("cancel", event => {
      if (resetInFlight) {
        event.preventDefault();
      }
    });
    resetConfirmDialog.addEventListener("close", () => {
      if (!resetConfirmSubmit.disabled) {
        clearResetConfirmation();
      }
    });

    document.getElementById("addProvider").addEventListener("click", async () => {
      const provider = createProvider("openai", false);
      try {
        await persistProvider(provider);
        render();
      } catch (_err) {}
    });

    document.getElementById("cancelButton").addEventListener("click", () => {
      if (!snapshot) {
        return;
      }

      const index = providers.findIndex(provider => provider.id === snapshot.id);
      if (index >= 0) {
        providers[index] = structuredClone(snapshot);
        render();
      }
    });

    function finishInitialLoading() {
      window.setTimeout(() => {
        loadingOverlay.classList.add("hide");
      }, 450);
    }

    async function showSaveAnimation() {
      saveButton.classList.remove("saved");
      saveButton.classList.add("saving");
      saveButton.disabled = true;

      await new Promise(resolve => window.setTimeout(resolve, 520));

      saveButton.classList.remove("saving");
      saveButton.classList.add("saved");
      saveButtonLabel.textContent = "已儲存";

      await new Promise(resolve => window.setTimeout(resolve, 760));

      saveButton.classList.remove("saved");
      saveButtonLabel.textContent = "確定";
      saveButton.disabled = false;
    }

    async function showValidateAnimation(isValid) {
      validateButton.classList.remove("failed");
      validateButton.classList.add("testing");
      validateButton.disabled = true;
      validateButton.textContent = "";

      await new Promise(resolve => window.setTimeout(resolve, 460));

      validateButton.classList.remove("testing");
      validateButton.classList.toggle("failed", !isValid);
      validateButton.textContent = isValid ? "✓" : "!";

      await new Promise(resolve => window.setTimeout(resolve, 720));

      validateButton.disabled = false;
      if (isValid) {
        validateButton.classList.remove("failed");
      }
    }

    saveButton.addEventListener("click", async () => {
      syncFromForm();
      const provider = currentProvider();
      if (!provider) {
        return;
      }

      saveButton.disabled = true;
      try {
        await persistProvider(provider);
        snapshot = currentProvider() ? structuredClone(currentProvider()) : null;
        await showSaveAnimation();
        render();
      } catch (_err) {
        saveButton.disabled = false;
        saveButtonLabel.textContent = "確定";
        saveButton.classList.remove("saving", "saved");
      }
    });

    validateButton.addEventListener("click", async () => {
      if (validateButton.disabled) return;
      const provider = currentProvider();
      if (!provider) {
        return;
      }

      syncFromForm();
      validateButton.disabled = true;
      const result = document.getElementById("validateResult");
      result.hidden = false;
      result.textContent = "測試中…";
      let message = "請確認 HOST 與 Chat API 路徑。";
      let ok = provider.host.length > 0 && provider.chatApi.startsWith("/");
      if (ok) {
        try {
          const saved = await persistProvider(provider);
          render();
          const payload = await apiRequest(`api/provider-configs/${encodeURIComponent(saved.id)}/test`, { method: "POST" });
          ok = Boolean(payload.ok);
          message = ok ? (payload.warning ? `對話測試成功；模型清單：${payload.warning}` : "對話測試成功") : (payload.message || "對話測試失敗");
          if (ok) {
            await refreshProviderAfterSuccess(saved.id);
          }
        } catch (_err) {
          ok = false;
          message = _err.message || "對話測試失敗";
        }
      }
      result.textContent = message;
      result.style.color = ok ? "#287d58" : "#b34233";
      await showValidateAnimation(ok);
    });

    oauthButton.addEventListener("click", async () => {
      const provider = currentProvider();
      if (!provider) {
        return;
      }
      if (!providerOAuthSupported(provider)) {
        window.alert("目前只有 OpenAI Codex Provider 支援 OAuth。");
        return;
      }

      syncFromForm();
      syncOAuthButton(provider, "pending");
      let refreshed = false;
      try {
        const saved = await persistProvider(provider);
        selectedId = saved.id;
        const payload = await apiRequest("api/provider/oauth/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: saved.id,
            flow_preference: "browser",
            launch_browser: false
          })
        });
        const oauth = payload.oauth || {};
        if (oauth.authorization_url) {
          window.open(oauth.authorization_url, "_blank", "noopener,noreferrer");
        }
        const connected = await pollProviderOAuthStatus(saved.id, 180000);
        if (!connected) {
          setOAuthManualMode(true, "OAuth 尚未自動完成，請貼上登入完成後的 redirect URL 或 authorization code。");
        } else {
          await refreshProviderAfterSuccess(saved.id);
          refreshed = true;
        }
      } catch (err) {
        window.alert(err.message || "OAuth 啟動失敗");
      } finally {
        if (!refreshed) {
          await loadProviderConfigs();
          render();
        }
      }
    });

    if (oauthManualMode) {
      oauthManualMode.addEventListener("change", () => {
        setOAuthManualMode(oauthManualMode.checked);
      });
    }

    if (oauthManualInput) {
      oauthManualInput.addEventListener("input", () => {
        setOAuthManualMessage("");
      });
    }

    if (oauthCompleteButton) {
      oauthCompleteButton.addEventListener("click", async () => {
        const provider = currentProvider();
        if (!provider) {
          return;
        }
        try {
          syncFromForm();
          const saved = await persistProvider(provider);
          selectedId = saved.id;
          await completeProviderOAuthManually(saved.id);
        } catch (err) {
          setOAuthManualMessage(err.message || "OAuth 完成失敗。", "error");
        }
      });
    }

    async function pollProviderOAuthStatus(providerId, timeoutMS) {
      const startedAt = Date.now();
      while (Date.now() - startedAt < timeoutMS) {
        const payload = await apiRequest(`api/provider/oauth/status?id=${encodeURIComponent(providerId)}`);
        const oauth = payload.oauth || {};
        if (oauth.status === "connected") {
          return true;
        }
        if (oauth.status === "failed") {
          throw new Error(oauth.last_error || oauth.message || "OAuth 登入失敗");
        }
        await sleep(1000);
      }
      return false;
    }

    async function completeProviderOAuthManually(providerId) {
      const input = oauthManualInput ? oauthManualInput.value.trim() : "";
      const validationError = validateOAuthManualInput(input);
      if (validationError) {
        setOAuthManualMessage(validationError, "error");
        return false;
      }
      setOAuthManualMessage("正在完成 OAuth...");
      if (oauthCompleteButton) {
        oauthCompleteButton.disabled = true;
      }
      try {
        const payload = await apiRequest("api/provider/oauth/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: providerId, input })
        });
        if (payload.success) {
          setOAuthManualMessage("OAuth 已連線。", "success");
          if (oauthManualInput) {
            oauthManualInput.value = "";
          }
          setOAuthManualMode(false);
          await refreshProviderAfterSuccess(providerId);
          return true;
        }
        setOAuthManualMessage("OAuth 完成失敗。", "error");
        return false;
      } catch (err) {
        setOAuthManualMessage(err.message || "OAuth 完成失敗。", "error");
        return false;
      } finally {
        if (oauthCompleteButton) {
          oauthCompleteButton.disabled = false;
        }
      }
    }

    function sleep(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    async function initializePage() {
      await loadProviderConfigs();
      render();
      finishInitialLoading();
    }

    window.addEventListener("lbp-language-changed", render);
    initializePage();
  </script>
</body>
</html>
